<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="No excuse. Or fail. A focused Pomodoro timer with tasks, backlog, calendar and archive.">
    <meta name="theme-color" content="#0e0f11">
    <title>NoXcuse</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <!-- Pick the theme before first paint (no flash) -->
    <script>
        (function () {
            var theme = 'system';
            try { theme = (JSON.parse(localStorage.getItem('nx.cfg')) || {}).theme || 'system'; } catch (e) {}
            var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">

    <!-- Built with: ./tailwindcss -i css/input.css -o css/output.css --minify -->
    <link rel="stylesheet" href="css/output.css">
</head>
<body>
    <div id="app"></div>
    <noscript>NoXcuse needs JavaScript to run.</noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
